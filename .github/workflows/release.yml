name: Release AAB

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          B64: ${{ secrets.PORTAGE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$B64" ]; then
            printf '%s' "$B64" | base64 -d > "$RUNNER_TEMP/portage.jks"
            echo "PORTAGE_KEYSTORE_PATH=$RUNNER_TEMP/portage.jks" >> "$GITHUB_ENV"
          else
            echo "No keystore secret configured; producing an unsigned bundle."
          fi

      - name: Build release AAB
        env:
          PORTAGE_KEYSTORE_PASSWORD: ${{ secrets.PORTAGE_KEYSTORE_PASSWORD }}
          PORTAGE_KEY_ALIAS: ${{ secrets.PORTAGE_KEY_ALIAS }}
          PORTAGE_KEY_PASSWORD: ${{ secrets.PORTAGE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: portage-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
